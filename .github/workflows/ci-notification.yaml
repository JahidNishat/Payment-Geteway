name: CI - Notification Service

on:
  push:
    paths:
      - "services/notification/**"
      - "gen/go/**"
      - ".github/workflows/ci-notification.yaml"
  pull_request:
    branches: [main]
    paths:
      - "services/notification/**"
      - "gen/go/**"
      - ".github/workflows/ci-notification.yaml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        working-directory: services/notification
        run: go mod download

      - name: Run tests
        working-directory: services/notification
        run: go test ./... -v

      - name: Build the service
        working-directory: services/notification
        run: go build -v ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f services/notification/Dockerfile \
            -t notification-service:${{ github.sha }} \
            .
      - name: Verify Docker image
        run: |
          docker images notification-service:${{ github.sha }}
